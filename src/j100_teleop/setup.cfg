# setup.cfg — ament_python 표준 스크립트 설치 경로 설정
# =========================================================
# [왜 이 파일이 필요한가?]
#
# 'ros2 run j100_teleop joystick_ui' 명령은 내부적으로
# install/lib/j100_teleop/joystick_ui 실행 파일을 찾아 실행한다.
#
# ament_python 빌드 시스템은 install/lib/<패키지명>/ 경로를 PATH에 추가하므로
# entry_points로 등록된 스크립트가 이 경로에 설치되어야 ros2 run이 정상 동작한다.
#
# 아래 설정이 없으면 setuptools가 스크립트를 기본 bin/ 위치에 설치해
# ros2 run이 실행 파일을 찾지 못하는 문제가 발생한다.
#
# [develop] 섹션: 'pip install -e .' (editable 모드) 시 스크립트 위치
# [install] 섹션: 'colcon build' (일반 설치) 시 스크립트 위치
# $base: setuptools가 결정하는 install prefix (예: install/j100_teleop)

[develop]
script_dir=$base/lib/j100_teleop

[install]
install_scripts=$base/lib/j100_teleop
